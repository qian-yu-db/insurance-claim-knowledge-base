# Modified from databricks/app-templates (agent-openai-agents-sdk-multiagent); see LICENSE and NOTICE.
bundle:
  name: agent_openai_agents_sdk_multiagent

resources:
  apps:
    agent_openai_agents_sdk_multiagent:
      name: "agent-openai-multiagent"
      description: "Adjuster console: claim document viewer + grounded chat (Lakebase hybrid
        search, claims functions, python_exec)"
      source_code_path: ./
      config:
        # Single process: FastAPI serves the agent (/invocations), the data APIs (/api/*),
        # and the 2-pane SPA (client/) as static files.
        command: ["uv", "run", "start-server"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: DATABRICKS_WAREHOUSE_ID
            value: "322702d284b4a804"
          - name: LAKEBASE_PROJECT_ID
            value: "insurance-claim"
          - name: LAKEBASE_BRANCH_ID
            value: "production"
          - name: LAKEBASE_ENDPOINT_ID
            value: "primary"
          - name: LAKEBASE_DATABASE
            value: "databricks_postgres"
          - name: LAKEBASE_SCHEMA
            value: "claims"
          # Conversation memory (Agents SDK sessions); created and owned by the app SP on first use
          - name: LAKEBASE_MEMORY_SCHEMA
            value: "agent_memory"
          - name: EMBEDDING_ENDPOINT
            value: "databricks-gte-large-en"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "2456186449359403"
            permission: 'CAN_MANAGE'

        # Claims functions (pipeline nb 09): structured tools, run on the SQL warehouse below
        - name: 'fn_claim_details'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.claim_details'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'fn_claim_payments'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.claim_payments'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'fn_claim_financials'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.claim_financials'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'fn_payment_totals'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.payment_totals'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'fn_top_claims'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.top_claims'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'fn_claim_notes'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.claim_notes'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'fact_payments'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.fact_payments'
            securable_type: 'TABLE'
            permission: 'SELECT'
        - name: 'claim_notes'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.claim_notes'
            securable_type: 'TABLE'
            permission: 'SELECT'

        # python_exec — ad-hoc calculations
        - name: 'python_exec'
          uc_securable:
            securable_full_name: 'system.ai.python_exec'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'

        # Orchestrator LLM: system.ai.gpt-5-2 via Unity Gateway (/ai-gateway/mlflow/v1). It's a
        # MODEL_SERVICE securable; `account users` hold EXECUTE, so no app resource is needed.

        # Lakebase (pgvector document search)
        - name: 'lakebase'
          postgres:
            branch: 'projects/insurance-claim/branches/production'
            database: 'projects/insurance-claim/branches/production/databases/databricks-postgres'
            permission: 'CAN_CONNECT_AND_CREATE'

        # Embedding model for document search
        - name: 'embedding_model'
          serving_endpoint:
            name: 'databricks-gte-large-en'
            permission: 'CAN_QUERY'

        # --- Viewer data access (doc/claim/file APIs) ---
        # Landing Volume — read source files (PDFs, images) for the viewer
        - name: 'landing_volume'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.landing'
            securable_type: 'VOLUME'
            permission: 'READ_VOLUME'
        - name: 'dim_claim'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.dim_claim'
            securable_type: 'TABLE'
            permission: 'SELECT'
        - name: 'bronze_file_registry'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.bronze_file_registry'
            securable_type: 'TABLE'
            permission: 'SELECT'
        - name: 'silver_documents'
          uc_securable:
            securable_full_name: 'fins_genai.claims_multimodal_kb.silver_documents'
            securable_type: 'TABLE'
            permission: 'SELECT'
        # SQL warehouse for the data APIs
        - name: 'sql_warehouse'
          sql_warehouse:
            id: '322702d284b4a804'
            permission: 'CAN_USE'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_openai_agents_sdk_multiagent:
          name: agent-openai-multiagent
