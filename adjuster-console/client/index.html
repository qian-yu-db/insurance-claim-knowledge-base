<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claims Adjuster Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Databricks Brand Palette ===== */
  :root {
    --db-red: #FF3621;
    --db-red-light: #FF6B57;
    --db-dark: #1B3139;
    --db-dark-80: #2D4A54;
    --db-green: #00A972;
    --db-green-light: #00D48F;
    --db-blue: #2272B4;
    --db-blue-light: #4A9FE5;
    --db-yellow: #FFB443;
    --db-purple: #8B5CF6;

    --bg: #F0F2F5;
    --panel: #FFFFFF;
    --panel-alt: #F8FAFB;
    --line: #E4E8ED;
    --line-light: #EEF1F5;
    --ink: #1B3139;
    --ink-secondary: #5A6B73;
    --ink-muted: #8D9BA3;

    --shadow-sm: 0 1px 2px rgba(27,49,57,0.06);
    --shadow-md: 0 4px 12px rgba(27,49,57,0.08);
    --shadow-lg: 0 8px 24px rgba(27,49,57,0.12);
    --shadow-glow: 0 0 20px rgba(255,54,33,0.15);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
    height: 100vh;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, var(--db-dark) 0%, var(--db-dark-80) 100%);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 100;
  }
  .logo {
    width: 28px; height: 28px;
    background: var(--db-red);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
    box-shadow: 0 2px 8px rgba(255,54,33,0.3);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header h1 span { color: var(--db-red-light); }
  .claim-select-wrap {
    margin-left: auto;
    position: relative;
  }
  .claim-select-wrap::after {
    content: '\25BC';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--ink-muted);
    pointer-events: none;
  }
  #claimSel {
    appearance: none;
    padding: 8px 32px 8px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    min-width: 380px;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  #claimSel:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.25); }
  #claimSel:focus { outline: none; border-color: var(--db-red-light); box-shadow: 0 0 0 3px rgba(255,54,33,0.2); }
  #claimSel option { background: var(--db-dark); color: #fff; }

  /* ===== Layout ===== */
  .wrap { display: flex; height: calc(100vh - 56px); }

  .left {
    width: 50%;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  .right {
    width: 50%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* ===== Section Titles ===== */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    padding: 12px 20px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .count {
    background: var(--line);
    color: var(--ink-secondary);
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 10px;
    font-weight: 500;
  }

  /* ===== Document List ===== */
  .doclist {
    max-height: 36%;
    overflow-y: auto;
    border-bottom: 1px solid var(--line);
    padding: 0 12px 8px;
  }
  .doclist::-webkit-scrollbar { width: 5px; }
  .doclist::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .doc {
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    border-radius: var(--radius-sm);
    transition: all 0.15s;
    margin: 2px 0;
  }
  .doc:hover { background: var(--panel-alt); }
  .doc.active {
    background: linear-gradient(135deg, rgba(255,54,33,0.06), rgba(255,54,33,0.02));
    box-shadow: inset 3px 0 0 var(--db-red);
  }
  .doc .icon {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
  }
  .doc .icon.pdf { background: #FEE2E2; color: #DC2626; }
  .doc .icon.img { background: #DBEAFE; color: #2563EB; }
  .doc .icon.txt { background: #D1FAE5; color: #059669; }
  .doc .icon.other { background: var(--line-light); color: var(--ink-secondary); }
  .doc .meta { overflow: hidden; }
  .doc .name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 500;
  }
  .doc .dtype {
    font-size: 11px; color: var(--ink-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ===== Viewer ===== */
  .viewer {
    flex: 1;
    overflow: auto;
    background: var(--panel-alt);
    position: relative;
  }
  .viewer embed, .viewer img { width: 100%; height: 100%; }
  .viewer img { object-fit: contain; }
  .viewer pre {
    white-space: pre-wrap;
    padding: 20px;
    margin: 0;
    font: 13px/1.6 'SF Mono', 'Fira Code', ui-monospace, Menlo, monospace;
    color: var(--ink-secondary);
  }
  .viewer .empty {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--ink-muted);
    padding: 24px;
  }
  .viewer .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  /* ===== Chat Area ===== */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* ===== Messages ===== */
  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    animation: msgIn 0.3s ease-out;
    position: relative;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--db-red) 0%, var(--db-red-light) 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(255,54,33,0.2);
    white-space: pre-wrap;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }

  /* Bot message markdown styles */
  .msg.bot > *:first-child { margin-top: 0; }
  .msg.bot > *:last-child { margin-bottom: 0; }
  .msg.bot p { margin: 0.5em 0; }
  .msg.bot ul, .msg.bot ol { margin: 0.5em 0; padding-left: 1.4em; }
  .msg.bot li { margin: 0.15em 0; }
  .msg.bot h1, .msg.bot h2, .msg.bot h3, .msg.bot h4 { margin: 0.6em 0 0.3em; font-size: 1em; font-weight: 700; }
  .msg.bot code { background: rgba(27,49,57,0.06); padding: 0.1em 0.4em; border-radius: 4px; font: 12px/1.5 'SF Mono', ui-monospace, monospace; }
  .msg.bot pre { background: rgba(27,49,57,0.04); padding: 10px 12px; border-radius: var(--radius-sm); overflow-x: auto; margin: 0.5em 0; }
  .msg.bot pre code { background: none; padding: 0; }
  .msg.bot strong { font-weight: 700; }
  .msg.bot a { color: var(--db-blue); text-decoration: none; border-bottom: 1px solid rgba(34,114,180,0.3); cursor: pointer; }
  .msg.bot a:hover { border-bottom-color: var(--db-blue); }

  /* ===== Agent Steps ===== */
  .steps-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--ink-secondary);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: var(--panel-alt);
    border: 1px solid var(--line-light);
    transition: all 0.3s;
  }
  .step.active {
    color: var(--db-blue);
    background: rgba(34,114,180,0.04);
    border-color: rgba(34,114,180,0.15);
  }
  .step.done {
    color: var(--db-green);
    background: rgba(0,169,114,0.04);
    border-color: rgba(0,169,114,0.15);
  }
  .step-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 10px;
  }
  .step.active .step-icon {
    background: rgba(34,114,180,0.1);
  }
  .step.done .step-icon {
    background: rgba(0,169,114,0.1);
  }

  /* Spinning animation for active steps */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(34,114,180,0.2);
    border-top-color: var(--db-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .checkmark {
    color: var(--db-green);
    font-weight: 700;
  }

  /* ===== Claim Summary Card ===== */
  .claim-card {
    background: linear-gradient(135deg, var(--db-dark) 0%, var(--db-dark-80) 100%);
    color: #fff;
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 8px;
    box-shadow: var(--shadow-md);
  }
  .claim-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .claim-card-id {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .claim-card-badge {
    background: rgba(255,255,255,0.15);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    backdrop-filter: blur(4px);
  }
  .claim-card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .claim-card-item {
    font-size: 12px;
  }
  .claim-card-label {
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 1px;
  }
  .claim-card-value {
    font-weight: 500;
    color: rgba(255,255,255,0.9);
  }

  /* ===== Composer ===== */
  .composer {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    box-shadow: 0 -2px 8px rgba(27,49,57,0.04);
  }
  .composer input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--panel);
    transition: all 0.2s;
  }
  .composer input::placeholder { color: var(--ink-muted); }
  .composer input:focus {
    outline: none;
    border-color: var(--db-red);
    box-shadow: 0 0 0 3px rgba(255,54,33,0.1);
  }
  .composer button {
    padding: 12px 24px;
    border: 0;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--db-red) 0%, var(--db-red-light) 100%);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(255,54,33,0.25);
    display: flex; align-items: center; gap: 6px;
  }
  .composer button:hover { box-shadow: 0 4px 14px rgba(255,54,33,0.35); transform: translateY(-1px); }
  .composer button:active { transform: translateY(0); }
  .composer button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  .hint {
    color: var(--ink-muted);
    font-size: 12px;
    padding: 0 20px 4px;
    background: var(--panel);
  }

  /* ===== Welcome State ===== */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-secondary);
  }
  .welcome-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--db-red), var(--db-red-light));
    border-radius: var(--radius-lg);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
    box-shadow: var(--shadow-glow);
  }
  .welcome h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .welcome p {
    font-size: 13px;
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }
  .quick-action {
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 12px;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: all 0.2s;
    background: var(--panel);
  }
  .quick-action:hover {
    border-color: var(--db-red);
    color: var(--db-red);
    background: rgba(255,54,33,0.04);
  }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .wrap { flex-direction: column; }
    .left, .right { width: 100%; }
    .left { height: 40%; }
    .right { height: 60%; }
    #claimSel { min-width: 200px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">◊</div>
  <h1>Insurance Claims — <span>Adjuster Console</span></h1>
  <div class="claim-select-wrap">
    <select id="claimSel"><option>Loading claims…</option></select>
  </div>
</header>
<div class="wrap">
  <div class="left">
    <div class="section-title">Documents <span class="count" id="docCount">0</span></div>
    <div class="doclist" id="docList"></div>
    <div class="section-title">Viewer</div>
    <div class="viewer" id="viewer">
      <div class="empty">
        <div class="empty-icon">📄</div>
        Select a document or click a source in a chat answer
      </div>
    </div>
  </div>
  <div class="right">
    <div class="chat" id="chat"></div>
    <div class="hint" id="claimHint"></div>
    <div class="composer">
      <input id="q" placeholder="Ask about this claim… e.g. Why was it referred to SIU?" autocomplete="off" />
      <button id="send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send
      </button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let claimId = null;
let docsByUri = {};
let docsByDocId = {};
let history = [];

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ========= Claims =========
async function loadClaims() {
  const claims = await jget("/api/claims");
  const sel = $("claimSel");
  sel.innerHTML = "";
  claims.forEach(c => {
    const o = document.createElement("option");
    o.value = c.claim_id;
    o.textContent = `${c.claim_id} \u00B7 ${c.carrier || ""} \u00B7 ${c.peril || ""} \u00B7 ${c.insured_name || ""}`;
    sel.appendChild(o);
  });
  sel.onchange = () => selectClaim(sel.value);
  if (claims.length) selectClaim(claims[0].claim_id);
}

async function selectClaim(cid) {
  claimId = cid;
  history = [];
  $("chat").innerHTML = "";
  $("claimHint").textContent = `Scoped to ${cid}. Answers cite documents you can open on the left.`;

  // Show welcome card
  showWelcome(cid);

  // Load docs
  const docs = await jget(`/api/claims/${cid}/docs`);
  docsByUri = {};
  docsByDocId = {};
  const list = $("docList");
  list.innerHTML = "";
  $("docCount").textContent = docs.length;

  docs.forEach(d => {
    docsByUri[d.source_uri] = d;
    docsByDocId[d.doc_id] = d;
    const el = document.createElement("div");
    el.className = "doc";
    const iconClass = getIconClass(d.ext);
    const iconLabel = (d.ext || "?").toUpperCase().slice(0, 4);
    el.innerHTML = `<div class="icon ${iconClass}">${iconLabel}</div><div class="meta"><div class="name">${esc(d.filename)}</div><div class="dtype">${esc(d.doc_type || d.modality || d.ext || "")}</div></div>`;
    el.onclick = () => openDoc(d.doc_id, d.ext, el);
    list.appendChild(el);
  });

  // Load summary card
  try {
    const summary = await jget(`/api/claims/${cid}/summary`);
    if (summary.claim_id) updateClaimCard(summary, docs.length);
  } catch(e) { /* optional endpoint */ }
}

function showWelcome(cid) {
  const chat = $("chat");
  const w = document.createElement("div");
  w.className = "welcome";
  w.id = "welcomeBlock";
  w.innerHTML = `
    <div class="welcome-icon">📊</div>
    <h2>Claim ${esc(cid)}</h2>
    <p>Ask about documents, medical findings, payments, investigation status, or anything else about this claim.</p>
    <div class="quick-actions">
      <div class="quick-action" onclick="quickAsk('Summarize this claim')">Summarize this claim</div>
      <div class="quick-action" onclick="quickAsk('What are the total payments?')">Total payments</div>
      <div class="quick-action" onclick="quickAsk('What medical findings are documented?')">Medical findings</div>
      <div class="quick-action" onclick="quickAsk('Why was this claim referred to SIU?')">SIU referral</div>
    </div>
  `;
  chat.appendChild(w);
}

function updateClaimCard(s, docCount) {
  const existing = document.getElementById("welcomeBlock");
  if (!existing) return;
  const cardHtml = `
    <div class="claim-card">
      <div class="claim-card-header">
        <div class="claim-card-id">${esc(s.claim_id)}</div>
        <div class="claim-card-badge">${esc(s.peril || "N/A")}</div>
      </div>
      <div class="claim-card-grid">
        <div class="claim-card-item"><div class="claim-card-label">Insured</div><div class="claim-card-value">${esc(s.insured_name || "N/A")}</div></div>
        <div class="claim-card-item"><div class="claim-card-label">Carrier</div><div class="claim-card-value">${esc(s.carrier || "N/A")}</div></div>
        <div class="claim-card-item"><div class="claim-card-label">Date of Loss</div><div class="claim-card-value">${esc(s.date_of_loss || "N/A")}</div></div>
        <div class="claim-card-item"><div class="claim-card-label">Max Amount</div><div class="claim-card-value">${s.max_amount_seen ? '$' + Number(s.max_amount_seen).toLocaleString() : 'N/A'}</div></div>
        <div class="claim-card-item"><div class="claim-card-label">Adjuster</div><div class="claim-card-value">${esc(s.adjuster_name || "N/A")}</div></div>
        <div class="claim-card-item"><div class="claim-card-label">Documents</div><div class="claim-card-value">${docCount !== undefined ? docCount : (s.doc_count || 0)}</div></div>
      </div>
    </div>
  `;
  existing.insertAdjacentHTML("afterbegin", cardHtml);
}

function quickAsk(q) {
  $("q").value = q;
  ask();
}

function getIconClass(ext) {
  ext = (ext || "").toLowerCase();
  if (ext === "pdf") return "pdf";
  if (["jpg","jpeg","png","gif","tiff","heic"].includes(ext)) return "img";
  if (["eml","html","xml","rtf","csv","txt"].includes(ext)) return "txt";
  return "other";
}

function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ========= Document Viewer =========
async function openDoc(docId, ext, el) {
  document.querySelectorAll(".doc.active").forEach(n => n.classList.remove("active"));
  if (el) el.classList.add("active");
  const v = $("viewer");
  const url = `/api/file?doc_id=${encodeURIComponent(docId)}`;
  ext = (ext || "").toLowerCase();
  if (ext === "pdf") { v.innerHTML = `<embed src="${url}" type="application/pdf" style="width:100%;height:100%">`; }
  else if (["jpg","jpeg","png","gif","tiff","heic"].includes(ext)) { v.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:contain">`; }
  else {
    const t = await (await fetch(url)).text();
    v.innerHTML = `<pre></pre>`;
    v.querySelector("pre").textContent = t;
  }
}

// ========= Chat =========
function addMsg(role, html, isHtml) {
  // Remove welcome on first user message
  const wb = document.getElementById("welcomeBlock");
  if (wb && role === "user") wb.remove();

  const m = document.createElement("div");
  m.className = `msg ${role}`;
  if (isHtml) m.innerHTML = html;
  else if (role === "bot") m.innerHTML = renderBot(html);
  else m.textContent = html;
  $("chat").appendChild(m);
  $("chat").scrollTop = $("chat").scrollHeight;
  return m;
}

function renderBot(text) { return linkifyCitations(renderMarkdown(text)); }

function renderMarkdown(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  const lines = (src || "").split(/\r?\n/);
  let html = "", list = null, inCode = false, code = "";
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (/^```/.test(line)) {
      if (inCode) { html += `<pre><code>${esc(code)}</code></pre>`; code = ""; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { code += (code ? "\n" : "") + raw; continue; }
    let m;
    if (!line.trim()) { closeList(); continue; }
    if (m = line.match(/^(#{1,6})\s+(.*)$/)) { closeList(); const l = m[1].length; html += `<h${l}>${inline(m[2])}</h${l}>`; }
    else if (m = line.match(/^\s*[-*+]\s+(.*)$/)) { if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if (m = line.match(/^\s*\d+\.\s+(.*)$/)) { if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  if (inCode) html += `<pre><code>${esc(code)}</code></pre>`;
  closeList();
  return html;
}

function linkifyCitations(html) {
  // doc_ids already embedded in links by the source_uri pass below — the
  // second pass must skip these, or it would splice anchors into the onclick
  // attributes it just created and corrupt the markup.
  const linkedDocIds = new Set();
  // Replace source_uri occurrences with clickable filename links
  Object.keys(docsByUri).forEach(uri => {
    if (html.includes(esc(uri)) || html.includes(uri)) {
      const d = docsByUri[uri];
      const link = `<a onclick="openDoc('${d.doc_id}','${d.ext}')">${esc(d.filename)}</a>`;
      html = html.split(esc(uri)).join(link).split(uri).join(link);
      linkedDocIds.add(d.doc_id);
    }
  });
  // Replace any remaining raw doc_id UUIDs the agent cited directly
  Object.keys(docsByDocId).forEach(docId => {
    if (linkedDocIds.has(docId)) return;  // already linked via source_uri above
    if (html.includes(docId)) {
      const d = docsByDocId[docId];
      const label = esc(d.filename || d.doc_type || docId);
      const link = `<a onclick="openDoc('${d.doc_id}','${d.ext}')">${label}</a>`;
      html = html.split(docId).join(link);
    }
  });
  return html;
}

// ========= Streaming Chat with Steps =========
async function ask() {
  const q = $("q").value.trim();
  if (!q || !claimId) return;
  $("q").value = "";
  $("send").disabled = true;
  addMsg("user", q);
  history.push({ role: "user", content: `[Claim ${claimId}] ${q}` });

  // Create the bot response container with steps
  const botContainer = document.createElement("div");
  botContainer.className = "msg bot";
  botContainer.style.animation = "msgIn 0.3s ease-out";

  const stepsDiv = document.createElement("div");
  stepsDiv.className = "steps-container";
  botContainer.appendChild(stepsDiv);

  const contentDiv = document.createElement("div");
  contentDiv.className = "bot-content";
  botContainer.appendChild(contentDiv);

  $("chat").appendChild(botContainer);
  $("chat").scrollTop = $("chat").scrollHeight;

  let fullText = "";
  const steps = new Map();

  try {
    const response = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: history }),
    });

    if (!response.ok) {
      const errText = await response.text().catch(() => response.statusText);
      throw new Error(`chat/stream ${response.status}: ${errText}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const dataStr = line.slice(6).trim();
        if (!dataStr || dataStr === "[DONE]") continue;

        try {
          const evt = JSON.parse(dataStr);

          if (evt.type === "step") {
            updateStep(stepsDiv, steps, evt);
          } else if (evt.type === "delta") {
            fullText += evt.text;
            contentDiv.innerHTML = renderBot(fullText);
          } else if (evt.type === "done") {
            // Clean up steps
            setTimeout(() => collapseSteps(stepsDiv), 800);
          }

          $("chat").scrollTop = $("chat").scrollHeight;
        } catch(e) { /* skip unparseable lines */ }
      }
    }

    if (!fullText) {
      // Fallback to non-streaming
      fullText = "(Streaming unavailable — retrying...)";
      contentDiv.innerHTML = renderBot(fullText);
      await fallbackAsk(contentDiv, stepsDiv, history);
    } else {
      history.push({ role: "assistant", content: fullText });
    }

  } catch (e) {
    if (fullText) {
      // Streaming failed mid-answer — keep what the user already saw rather
      // than wiping it, and record it so history stays consistent.
      console.error("chat/stream error after partial response:", e);
      stepsDiv.innerHTML = "";
      history.push({ role: "assistant", content: fullText });
    } else {
      // Nothing streamed yet — fall back to non-streaming /invocations
      await fallbackAsk(contentDiv, stepsDiv, history);
    }
  } finally {
    $("send").disabled = false;
    $("chat").scrollTop = $("chat").scrollHeight;
  }
}

async function fallbackAsk(contentDiv, stepsDiv, hist) {
  stepsDiv.innerHTML = '';
  contentDiv.innerHTML = '<div style="color:var(--ink-muted)">Thinking...</div>';
  try {
    const r = await fetch("/invocations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: hist }),
    });
    const d = await r.json();
    const text = extractText(d);
    contentDiv.innerHTML = renderBot(text);
    hist.push({ role: "assistant", content: text });
  } catch(e2) {
    contentDiv.innerHTML = `<span style="color:var(--db-red)">Error: ${esc(e2.message)}</span>`;
  }
}

function extractText(d) {
  const out = d.output || [];
  const parts = [];
  for (const it of out) {
    if (it.type !== "message") continue;
    const c = it.content;
    if (typeof c === "string") parts.push(c);
    else if (Array.isArray(c)) c.forEach(p => { if (p && p.text) parts.push(p.text); });
  }
  return parts.join("\n") || "(no answer)";
}

function updateStep(container, steps, evt) {
  let stepEl = steps.get(evt.id);
  if (!stepEl) {
    stepEl = document.createElement("div");
    stepEl.className = "step active";
    stepEl.innerHTML = `<div class="step-icon"><div class="spinner"></div></div><span class="step-label">${esc(evt.label)}</span>`;
    container.appendChild(stepEl);
    steps.set(evt.id, stepEl);
  }

  if (evt.status === "done") {
    stepEl.className = "step done";
    stepEl.querySelector(".step-icon").innerHTML = '<span class="checkmark">✓</span>';
  } else if (evt.status === "active") {
    stepEl.className = "step active";
    stepEl.querySelector(".step-icon").innerHTML = '<div class="spinner"></div>';
  }
}

function collapseSteps(container) {
  container.style.transition = "max-height 0.4s ease, opacity 0.3s ease";
  container.style.maxHeight = container.scrollHeight + "px";
  requestAnimationFrame(() => {
    container.style.maxHeight = "0";
    container.style.opacity = "0";
    container.style.overflow = "hidden";
  });
  setTimeout(() => container.style.display = "none", 500);
}

// ========= Init =========
$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
loadClaims().catch(e => addMsg("bot", "Failed to load claims: " + e.message));
</script>
