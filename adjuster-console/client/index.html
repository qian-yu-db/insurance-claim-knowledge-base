<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claims Adjuster Console</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#e2e5ea; --ink:#1b2333; --muted:#6b7382; --brand:#142850; --accent:#2f6fed; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header select { margin-left:auto; padding:6px 10px; border-radius:6px; border:1px solid #33405f; background:#fff; font-size:13px; min-width:340px; }
  .wrap { display:flex; height:calc(100vh - 44px); }
  .left { width:52%; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .right { width:48%; display:flex; flex-direction:column; background:var(--panel); }
  .section-title { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px 12px 4px; }
  .doclist { max-height:34%; overflow:auto; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .doc { padding:6px 12px; cursor:pointer; display:flex; gap:8px; align-items:center; font-size:13px; }
  .doc:hover { background:#eef2fb; }
  .doc.active { background:#e0e9ff; }
  .doc .tag { font-size:10px; color:#fff; background:var(--muted); border-radius:4px; padding:1px 6px; }
  .doc .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viewer { flex:1; overflow:auto; background:#fbfbfc; }
  .viewer embed, .viewer img { width:100%; height:100%; }
  .viewer img { object-fit:contain; }
  .viewer pre { white-space:pre-wrap; padding:16px; margin:0; font:13px/1.5 ui-monospace,Menlo,monospace; }
  .viewer .empty { color:var(--muted); padding:24px; }
  .chat { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:9px 12px; border-radius:10px; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; white-space:pre-wrap; }
  .msg.bot { align-self:flex-start; background:#eef0f4; }
  .msg a { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .msg.bot a { word-break:break-all; }
  /* rendered markdown inside bot messages */
  .msg.bot > *:first-child { margin-top:0; }
  .msg.bot > *:last-child { margin-bottom:0; }
  .msg.bot p { margin:.5em 0; }
  .msg.bot ul, .msg.bot ol { margin:.5em 0; padding-left:1.4em; }
  .msg.bot li { margin:.15em 0; }
  .msg.bot h1, .msg.bot h2, .msg.bot h3, .msg.bot h4, .msg.bot h5, .msg.bot h6 { margin:.6em 0 .3em; font-size:1em; font-weight:700; }
  .msg.bot code { background:rgba(0,0,0,.06); padding:.05em .35em; border-radius:4px; font:12px/1.45 ui-monospace,Menlo,monospace; }
  .msg.bot pre { background:rgba(0,0,0,.06); padding:8px 10px; border-radius:6px; overflow-x:auto; margin:.5em 0; }
  .msg.bot pre code { background:none; padding:0; }
  .msg.bot strong { font-weight:700; }
  .composer { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  .composer input { flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .composer button { padding:9px 16px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer; }
  .composer button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); font-size:12px; padding:0 14px 8px; }
</style>
</head>
<body>
<header>
  <h1>Insurance Claims — Adjuster Console</h1>
  <select id="claimSel"><option>Loading claims…</option></select>
</header>
<div class="wrap">
  <div class="left">
    <div class="section-title">Documents</div>
    <div class="doclist" id="docList"></div>
    <div class="section-title">Viewer</div>
    <div class="viewer" id="viewer"><div class="empty">Select a document, or click a source in a chat answer.</div></div>
  </div>
  <div class="right">
    <div class="chat" id="chat"></div>
    <div class="hint" id="claimHint"></div>
    <div class="composer">
      <input id="q" placeholder="Ask about this claim… e.g. Why was it referred to SIU?" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let claimId = null;
let docsByUri = {};      // source_uri -> doc
let history = [];        // conversation for /invocations

async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }

async function loadClaims() {
  const claims = await jget("/api/claims");
  const sel = $("claimSel");
  sel.innerHTML = "";
  claims.forEach(c => {
    const o = document.createElement("option");
    o.value = c.claim_id;
    o.textContent = `${c.claim_id} · ${c.carrier || ""} · ${c.peril || ""} · ${c.insured_name || ""}`;
    sel.appendChild(o);
  });
  sel.onchange = () => selectClaim(sel.value);
  if (claims.length) selectClaim(claims[0].claim_id);
}

async function selectClaim(cid) {
  claimId = cid;
  history = [];
  $("chat").innerHTML = "";
  $("claimHint").textContent = `Chat is scoped to ${cid}. Answers cite sources you can open on the left.`;
  addMsg("bot", `Ready to help with claim ${cid}. Ask about documents, medical findings, payments, or investigation status.`);
  const docs = await jget(`/api/claims/${cid}/docs`);
  docsByUri = {};
  const list = $("docList");
  list.innerHTML = "";
  docs.forEach(d => {
    docsByUri[d.source_uri] = d;
    const el = document.createElement("div");
    el.className = "doc";
    el.dataset.docId = d.doc_id;
    el.innerHTML = `<span class="tag">${d.doc_type || d.modality || d.ext}</span><span class="name">${d.filename}</span>`;
    el.onclick = () => openDoc(d.doc_id, d.ext, el);
    list.appendChild(el);
  });
}

async function openDoc(docId, ext, el) {
  document.querySelectorAll(".doc.active").forEach(n => n.classList.remove("active"));
  if (el) el.classList.add("active");
  const v = $("viewer");
  const url = `/api/file?doc_id=${encodeURIComponent(docId)}`;
  ext = (ext || "").toLowerCase();
  if (ext === "pdf") { v.innerHTML = `<embed src="${url}" type="application/pdf">`; }
  else if (["jpg","jpeg","png","gif","tiff","heic"].includes(ext)) { v.innerHTML = `<img src="${url}">`; }
  else { const t = await (await fetch(url)).text(); v.innerHTML = `<pre></pre>`; v.querySelector("pre").textContent = t; }
}

function addMsg(role, text) {
  const m = document.createElement("div");
  m.className = `msg ${role}`;
  if (role === "bot") m.innerHTML = renderBot(text);
  else m.textContent = text;
  $("chat").appendChild(m);
  $("chat").scrollTop = $("chat").scrollHeight;
  return m;
}

// Bot messages arrive as markdown → render to HTML, then linkify any cited source_uri.
function renderBot(text) { return linkifyCitations(renderMarkdown(text)); }

// Minimal, self-contained markdown → HTML (no external lib, CSP-safe).
// Escapes first, then handles headings, bullet/numbered lists, fenced + inline code,
// bold/italic (asterisks only, so snake_case paths like fins_genai aren't mangled), and links.
function renderMarkdown(src) {
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  const lines = (src || "").split(/\r?\n/);
  let html = "", list = null, inCode = false, code = "";
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (/^```/.test(line)) {                                   // fenced code toggle
      if (inCode) { html += `<pre><code>${esc(code)}</code></pre>`; code = ""; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { code += (code ? "\n" : "") + raw; continue; }
    let m;
    if (!line.trim()) { closeList(); continue; }
    if (m = line.match(/^(#{1,6})\s+(.*)$/)) { closeList(); const l = m[1].length; html += `<h${l}>${inline(m[2])}</h${l}>`; }
    else if (m = line.match(/^\s*[-*+]\s+(.*)$/)) { if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if (m = line.match(/^\s*\d+\.\s+(.*)$/)) { if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  if (inCode) html += `<pre><code>${esc(code)}</code></pre>`;
  closeList();
  return html;
}

// Turn any cited dbfs:/Volumes/... source_uri we know about into a clickable link that opens it.
// Operates on already-rendered HTML (renderMarkdown handled escaping).
function linkifyCitations(html) {
  Object.keys(docsByUri).forEach(uri => {
    if (html.includes(uri)) {
      const d = docsByUri[uri];
      const link = `<a onclick="openDoc('${d.doc_id}','${d.ext}')">${d.filename}</a>`;
      html = html.split(uri).join(link);
    }
  });
  return html;
}

async function ask() {
  const q = $("q").value.trim();
  if (!q || !claimId) return;
  $("q").value = "";
  $("send").disabled = true;
  addMsg("user", q);
  history.push({ role: "user", content: `[Claim ${claimId}] ${q}` });
  const thinking = addMsg("bot", "…");
  try {
    const r = await fetch("/invocations", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: history }),
    });
    const d = await r.json();
    const text = extractText(d);
    thinking.innerHTML = renderBot(text);
    history.push({ role: "assistant", content: text });
  } catch (e) {
    thinking.textContent = "Error: " + e.message;
  } finally {
    $("send").disabled = false;
    $("chat").scrollTop = $("chat").scrollHeight;
  }
}

function extractText(d) {
  const out = d.output || [];
  const parts = [];
  for (const it of out) {
    if (it.type !== "message") continue;
    const c = it.content;
    if (typeof c === "string") parts.push(c);
    else if (Array.isArray(c)) c.forEach(p => { if (p && p.text) parts.push(p.text); });
  }
  return parts.join("\n") || "(no answer)";
}

$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
loadClaims().catch(e => addMsg("bot", "Failed to load claims: " + e.message));
</script>
</body>
</html>
